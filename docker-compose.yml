services:
  redis:
    build:
      context: .
      dockerfile: Dockerfile-redis
    image: redis:latest
    container_name: redis
    ports:
      - "6377:6379"
    ulimits:
      memlock: -1

  dragonfly:
    build:
      context: .
      dockerfile: Dockerfile-dragonfly
    image: dragonfly:latest
    container_name: dragonfly
    ports:
      - "6381:6379"
    ulimits:
      memlock: -1

